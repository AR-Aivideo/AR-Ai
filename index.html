<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR ai - Text to Video</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PayPal SDK -->
    <script src="https://www.paypal.com/sdk/js?client-id=BAA_bdWr_OdmF1y_3tOn55i013VoUO7FC7xJhZCwcR2S4YiQQTJjJgsPhDegYP6rkzQEpu3oUq0a-xvGtA&currency=USD"></script>
    <style>
        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-45deg);
            font-size: 3rem;
            color: rgba(255, 255, 255, 0.3);
            pointer-events: none;
            z-index: 10;
        }
        .glass { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen font-sans">

    <!-- Auth Container -->
    <div id="auth-section" class="max-w-md mx-auto pt-20 px-6">
        <div class="bg-slate-800 p-8 rounded-2xl shadow-xl border border-slate-700">
            <h1 class="text-3xl font-bold text-center mb-6 text-blue-400">AR ai</h1>
            
            <div id="login-form">
                <input type="email" id="email" placeholder="Email" class="w-full p-3 mb-4 rounded bg-slate-700 border border-slate-600 focus:outline-none focus:border-blue-500">
                <input type="password" id="password" placeholder="Password" class="w-full p-3 mb-4 rounded bg-slate-700 border border-slate-600 focus:outline-none focus:border-blue-500">
                <button onclick="handleAuth('login')" class="w-full bg-blue-600 hover:bg-blue-700 p-3 rounded font-bold transition mb-3">Masuk</button>
                <button onclick="handleAuth('signup')" class="w-full text-blue-400 hover:underline text-sm">Belum punya akun? Daftar</button>
                <button onclick="forgotPassword()" class="w-full text-slate-400 hover:underline text-xs mt-4">Lupa Kata Sandi?</button>
            </div>
        </div>
    </div>

    <!-- Main App (Hidden by default) -->
    <div id="app-section" class="hidden">
        <!-- Navbar -->
        <nav class="bg-slate-800 border-b border-slate-700 p-4 flex justify-between items-center px-6">
            <h2 class="text-xl font-bold text-blue-400">AR ai</h2>
            <div class="flex items-center gap-4">
                <span class="bg-blue-900 text-blue-200 px-3 py-1 rounded-full text-sm">
                    Kredit: <span id="user-credits">0</span>
                </span>
                <button onclick="logout()" class="text-sm text-red-400">Keluar</button>
            </div>
        </nav>

        <div class="max-w-6xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Input Side -->
            <div class="lg:col-span-1 space-y-6">
                <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
                    <h3 class="text-lg font-semibold mb-4">Buat Video</h3>
                    <textarea id="prompt" rows="4" placeholder="Masukkan deskripsi video..." class="w-full p-3 rounded bg-slate-700 border border-slate-600 focus:outline-none focus:border-blue-500 text-sm mb-4"></textarea>
                    <button id="generate-btn" onclick="generateVideo()" class="w-full bg-gradient-to-r from-blue-600 to-cyan-500 p-3 rounded-lg font-bold hover:scale-105 transition">
                        Generate (1 Kredit)
                    </button>
                </div>

                <!-- Referral -->
                <div class="bg-blue-900/30 p-4 rounded-xl border border-blue-500/30">
                    <p class="text-xs text-blue-300">Bagikan link & dapatkan 1 kredit per teman!</p>
                    <code id="ref-link" class="text-[10px] block mt-2 bg-black/40 p-2 rounded truncate">arai.com/ref?user=123</code>
                </div>
            </div>

            <!-- Preview Side -->
            <div class="lg:col-span-2">
                <div class="relative bg-black rounded-2xl aspect-video overflow-hidden border border-slate-700 shadow-2xl flex flex-col items-center justify-center">
                    <div id="video-placeholder" class="text-slate-500 text-center p-10">
                        <p>Hasil video akan muncul di sini</p>
                    </div>
                    
                    <div id="result-video" class="hidden w-full h-full p-8 overflow-y-auto">
                        <div id="watermark-el" class="watermark">AR ai</div>
                        <h4 class="text-blue-400 font-bold mb-2">Storyboard AI:</h4>
                        <p id="ai-response" class="text-slate-300 italic"></p>
                    </div>
                </div>

                <!-- Payment Section -->
                <div class="mt-8 grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
                        <h4 class="font-bold mb-2">Beli 50 Kredit</h4>
                        <p class="text-2xl font-bold mb-4">$5.00</p>
                        <div id="paypal-credit-button"></div>
                    </div>
                    <div class="bg-gradient-to-br from-indigo-900 to-slate-800 p-6 rounded-xl border border-indigo-500 shadow-lg">
                        <div class="flex justify-between items-start">
                            <h4 class="font-bold mb-2">Langganan Pro</h4>
                            <span class="text-[10px] bg-indigo-500 px-2 py-0.5 rounded">HAPUS WATERMARK</span>
                        </div>
                        <p class="text-2xl font-bold mb-4">$15.00<span class="text-xs text-slate-400">/bulan</span></p>
                        <div id="paypal-sub-button"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        // Firebase Setup (Otomatis menggunakan konfigurasi internal)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Konfigurasi ini biasanya diisi otomatis oleh platform hosting Firebase Anda
        const firebaseConfig = {
            apiKey: "AIzaSyAkbrYAWnRd-gmBZIQGrPKz4LJMO8sPaqY", // Menggunakan Gemini Key sebagai placeholder (biasanya berbeda)
            authDomain: "arai-platform.firebaseapp.com",
            projectId: "arai-platform",
            storageBucket: "arai-platform.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Global State
        let currentUser = null;
        let userData = { credits: 0, isSubscribed: false };

        // AUTH FUNCTIONS
        window.handleAuth = async (type) => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            try {
                if(type === 'signup') {
                    const res = await createUserWithEmailAndPassword(auth, email, pass);
                    await initUserDoc(res.user.uid);
                } else {
                    await signInWithEmailAndPassword(auth, email, pass);
                }
            } catch (err) { alert("Error: " + err.message); }
        };

        window.logout = () => signOut(auth);

        window.forgotPassword = () => {
            const email = prompt("Masukkan email Anda:");
            if(email) sendPasswordResetEmail(auth, email).then(() => alert("Email reset terkirim!"));
        };

        async function initUserDoc(uid) {
            await setDoc(doc(db, "users", uid), {
                credits: 5,
                isSubscribed: false,
                lastDailyReset: new Date().toDateString(),
                referralId: Math.random().toString(36).substring(7)
            });
        }

        // APP LOGIC
        onAuthStateChanged(auth, async (user) => {
            const authSec = document.getElementById('auth-section');
            const appSec = document.getElementById('app-section');
            
            if (user) {
                currentUser = user;
                authSec.classList.add('hidden');
                appSec.classList.remove('hidden');
                
                // Real-time update dari Firestore
                onSnapshot(doc(db, "users", user.uid), (snapshot) => {
                    if(snapshot.exists()) {
                        userData = snapshot.data();
                        document.getElementById('user-credits').innerText = userData.credits;
                        document.getElementById('ref-link').innerText = `arai.com/ref?code=${userData.referralId}`;
                        
                        // Check Watermark
                        const wm = document.getElementById('watermark-el');
                        if(userData.isSubscribed) wm.classList.add('hidden');
                        else wm.classList.remove('hidden');

                        // Daily Credit Reset Logic
                        checkDailyBonus(user.uid, userData);
                    }
                });
            } else {
                authSec.classList.remove('hidden');
                appSec.classList.add('hidden');
            }
        });

        async function checkDailyBonus(uid, data) {
            const today = new Date().toDateString();
            if(data.lastDailyReset !== today) {
                await updateDoc(doc(db, "users", uid), {
                    credits: increment(5),
                    lastDailyReset: today
                });
                alert("Bonus harian! +5 Kredit ditambahkan.");
            }
        }

        // GEMINI AI INTEGRATION
        window.generateVideo = async () => {
            const promptText = document.getElementById('prompt').value;
            if(!promptText) return alert("Isi deskripsi dulu!");
            if(userData.credits < 1) return alert("Kredit habis! Silakan beli atau tunggu besok.");

            const btn = document.getElementById('generate-btn');
            btn.disabled = true;
            btn.innerText = "Processing...";

            try {
                // Kurangi Kredit
                await updateDoc(doc(db, "users", currentUser.uid), { credits: increment(-1) });

                // Call Gemini API
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=AIzaSyAkbrYAWnRd-gmBZIQGrPKz4LJMO8sPaqY`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `Create a detailed cinematic video storyboard for: ${promptText}` }] }]
                    })
                });
                
                const data = await response.json();
                const aiText = data.candidates[0].content.parts[0].text;

                document.getElementById('video-placeholder').classList.add('hidden');
                document.getElementById('result-video').classList.remove('hidden');
                document.getElementById('ai-response').innerText = aiText;

            } catch (err) {
                alert("Gagal memproses AI.");
            } finally {
                btn.disabled = false;
                btn.innerText = "Generate (1 Kredit)";
            }
        };

        // PAYPAL BUTTONS
        paypal.Buttons({
            createOrder: (data, actions) => actions.order.create({
                purchase_units: [{ amount: { value: '5.00' } }]
            }),
            onApprove: async (data, actions) => {
                await updateDoc(doc(db, "users", currentUser.uid), { credits: increment(50) });
                alert("Pembelian 50 Kredit Berhasil!");
            }
        }).render('#paypal-credit-button');

        paypal.Buttons({
            createOrder: (data, actions) => actions.order.create({
                purchase_units: [{ amount: { value: '15.00' } }]
            }),
            onApprove: async (data, actions) => {
                await updateDoc(doc(db, "users", currentUser.uid), { isSubscribed: true });
                alert("Anda sekarang member PRO! Watermark dihapus.");
            }
        }).render('#paypal-sub-button');

    </script>
</body>
</html>
