<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR ai - Text to Video Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-app-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-auth-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-firestore-compat.min.js"></script>
    <!-- PayPal SDK menggunakan Client ID Anda -->
    <script src="https://www.paypal.com/sdk/js?client-id=BAA_bdWr_OdmF1y_3tOn55i013VoUO7FC7xJhZCwcR2S4YiQQTJjJgsPhDegYP6rkzQEpu3oUq0a-xvGtA&currency=USD"></script>
    <style>
        .glass { background: rgba(31, 41, 55, 0.7); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-black text-white font-sans min-h-screen">

    <!-- Navigasi -->
    <nav class="p-4 border-b border-gray-800 flex justify-between items-center sticky top-0 bg-black z-50">
        <h1 class="text-2xl font-black text-blue-500 tracking-tighter">AR ai</h1>
        <div id="auth-status"></div>
    </nav>

    <!-- Form Login/Daftar -->
    <div id="auth-form" class="max-w-md mx-auto mt-20 p-8 glass rounded-2xl border border-gray-800 shadow-2xl">
        <h2 id="form-title" class="text-2xl font-bold mb-6 text-center text-blue-400">Masuk ke AR ai</h2>
        <div class="space-y-4">
            <input type="email" id="email" placeholder="Email" class="w-full p-3 rounded-xl bg-gray-900 border border-gray-700 outline-none">
            <input type="password" id="password" placeholder="Password" class="w-full p-3 rounded-xl bg-gray-900 border border-gray-700 outline-none">
            <button id="main-auth-btn" class="w-full bg-blue-600 hover:bg-blue-500 p-4 rounded-xl font-bold transition">MASUK</button>
            <div class="flex justify-between text-xs px-1">
                <a href="#" id="toggle-auth" class="text-blue-400 hover:underline">Daftar Akun Baru</a>
                <a href="#" id="forgot-pw" class="text-gray-500 hover:underline">Lupa Sandi?</a>
            </div>
        </div>
    </div>

    <!-- Dashboard Utama -->
    <main id="app-content" class="hidden container mx-auto p-4">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Kolom Pembuatan Video -->
            <div class="lg:col-span-2 space-y-6">
                <div class="glass p-6 rounded-3xl border border-gray-800">
                    <h2 class="text-xl font-bold mb-4">🎬 Video Generator</h2>
                    <textarea id="prompt-input" rows="5" class="w-full bg-gray-900/50 p-5 rounded-2xl border border-gray-700 outline-none" placeholder="Tulis teks untuk jadi video..."></textarea>
                    <button id="generate-btn" class="mt-4 w-full bg-blue-600 p-4 rounded-2xl font-bold shadow-xl">BUAT VIDEO (1 Kredit)</button>
                    <div id="result-area" class="mt-6 hidden">
                        <div id="ai-response" class="bg-gray-900 p-4 rounded-xl border border-gray-700 text-gray-300 whitespace-pre-wrap"></div>
                    </div>
                </div>
            </div>

            <!-- Kolom Info Kredit & Referal -->
            <div class="space-y-6">
                <div class="glass p-6 rounded-3xl border border-blue-900/50">
                    <p id="display-email" class="text-xs text-gray-500 truncate mb-1"></p>
                    <h3 class="text-sm font-bold text-gray-400">Sisa Kredit:</h3>
                    <span id="credit-count" class="text-5xl font-black text-white">0</span>
                </div>
                <div class="glass p-6 rounded-3xl border border-gray-800">
                    <h3 class="font-bold mb-4">🛒 Isi Ulang Kredit</h3>
                    <div id="paypal-button-container"></div>
                </div>
                <div class="glass p-6 rounded-3xl border border-gray-800 text-center">
                    <h3 class="text-xs font-bold text-gray-500 mb-2">KODE REFERAL SAYA:</h3>
                    <code id="ref-code" class="text-blue-400 font-mono block bg-black p-2 rounded mb-2">LOADING...</code>
                    <p class="text-[10px] text-gray-500">Dapat +1 kredit jika teman daftar pakai link Anda</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        // INTEGRASI FIREBASE ANDA
        const firebaseConfig = {
            apiKey: "AIzaSyClLSO35yldEXJl0HJnQ3mTFo4kxZICs5k",
            authDomain: "ar-ai-generator-8a388.firebaseapp.com",
            projectId: "ar-ai-generator-8a388",
            storageBucket: "ar-ai-generator-8a388.firebasestorage.app",
            messagingSenderId: "871534184989",
            appId: "1:871534184989:web:65ff5cab9e3db19b8414f4",
            measurementId: "G-NDR1LQ7KXV"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const AI_KEY = "AIzaSyAgcaRt967erWBF5cPv71nxjyZlD0mvmRI";

        let isLogin = true;
        let currentUser = null;

        // LOGIKA LOGIN & DAFTAR + REFERAL
        document.getElementById('main-auth-btn').onclick = async () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            const urlParams = new URLSearchParams(window.location.search);
            const refFromUrl = urlParams.get('ref');

            if(!email || !pass) return alert("Isi email dan password!");

            try {
                if(isLogin) {
                    await auth.signInWithEmailAndPassword(email, pass);
                } else {
                    const res = await auth.createUserWithEmailAndPassword(email, pass);
                    // Buat data user di database
                    await db.collection('users').doc(res.user.uid).set({
                        email: email,
                        credits: 5, // Bonus awal
                        referralCode: 'AR-' + Math.random().toString(36).substring(7).toUpperCase(),
                        lastDailyReset: firebase.firestore.Timestamp.now()
                    });

                    // Cek jika dia diajak orang (Referal)
                    if(refFromUrl) {
                        const refQuery = await db.collection('users').where('referralCode', '==', refFromUrl).get();
                        if(!refQuery.empty) {
                            await db.collection('users').doc(refQuery.docs[0].id).update({
                                credits: firebase.firestore.FieldValue.increment(1)
                            });
                        }
                    }
                }
            } catch (e) { alert(e.message); }
        };

        // PANTAU STATUS LOGIN
        auth.onAuthStateChanged(user => {
            if(user) {
                currentUser = user;
                document.getElementById('auth-form').classList.add('hidden');
                document.getElementById('app-content').classList.remove('hidden');
                document.getElementById('auth-status').innerHTML = `<button onclick="auth.signOut()" class="text-xs text-red-500">Keluar</button>`;
                
                db.collection('users').doc(user.uid).onSnapshot(doc => {
                    if(doc.exists) {
                        const data = doc.data();
                        document.getElementById('credit-count').innerText = data.credits;
                        document.getElementById('display-email').innerText = data.email;
                        document.getElementById('ref-code').innerText = data.referralCode;
                        checkDailyBonus(data);
                    }
                });
                renderPayPal();
            } else {
                document.getElementById('auth-form').classList.remove('hidden');
                document.getElementById('app-content').classList.add('hidden');
            }
        });

        // BONUS HARIAN 5 KREDIT
        async function checkDailyBonus(data) {
            const today = new Date().toDateString();
            const last = data.lastDailyReset.toDate().toDateString();
            if(today !== last) {
                await db.collection('users').doc(currentUser.uid).update({
                    credits: firebase.firestore.FieldValue.increment(5),
                    lastDailyReset: firebase.firestore.Timestamp.now()
                });
                alert("Bonus harian +5 kredit telah masuk!");
            }
        }

        // BUAT VIDEO (AI STUDIO)
        document.getElementById('generate-btn').onclick = async () => {
            const prompt = document.getElementById('prompt-input').value;
            const userDoc = await db.collection('users').doc(currentUser.uid).get();
            if(userDoc.data().credits < 1) return alert("Kredit habis!");

            document.getElementById('generate-btn').innerText = "Sedang Membuat...";
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${AI_KEY}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const json = await res.json();
                document.getElementById('result-area').classList.remove('hidden');
                document.getElementById('ai-response').innerText = json.candidates[0].content.parts[0].text;
                
                await db.collection('users').doc(currentUser.uid).update({
                    credits: firebase.firestore.FieldValue.increment(-1)
                });
            } catch (e) { alert("Gagal: " + e.message); }
            document.getElementById('generate-btn').innerText = "BUAT VIDEO (1 Kredit)";
        };

        // PAYPAL PEMBAYARAN
        function renderPayPal() {
            document.getElementById('paypal-button-container').innerHTML = '';
            paypal.Buttons({
                createOrder: (data, actions) => actions.order.create({ purchase_units: [{ amount: { value: '2.00' } }] }),
                onApprove: (data, actions) => actions.order.capture().then(async () => {
                    await db.collection('users').doc(currentUser.uid).update({
                        credits: firebase.firestore.FieldValue.increment(10)
                    });
                    alert("Pembelian Berhasil! +10 Kredit.");
                })
            }).render('#paypal-button-container');
        }

        // TOGGLE LOGIN/DAFTAR
        document.getElementById('toggle-auth').onclick = (e) => {
            e.preventDefault();
            isLogin = !isLogin;
            document.getElementById('form-title').innerText = isLogin ? 'Masuk ke AR ai' : 'Daftar Akun Baru';
            document.getElementById('main-auth-btn').innerText = isLogin ? 'MASUK' : 'DAFTAR SEKARANG';
        };
    </script>
</body>
</html>
