<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.paypal.com/sdk/js?client-id=BAA_bdWr_OdmF1y_3tOn55i013VoUO7FC7xJhZCwcR2S4YiQQTJjJgsPhDegYP6rkzQEpu3oUq0a-xvGtA&components=buttons,funding-eligibility"></script>
    <link href="https://cdn.jsdelivr.net/npm/lucide-static@0.344.0/font/lucide.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: white; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyBZn9twI9HiXgs84bK7nZmpjrnelO6Pn70",
            authDomain: "ar-ai-82399.firebaseapp.com",
            projectId: "ar-ai-82399",
            storageBucket: "ar-ai-82399.firebasestorage.app",
            messagingSenderId: "378276222105",
            appId: "1:378276222105:web:54b323909d25f0f1985408",
            measurementId: "G-6D337BYC0Y"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        function App() {
            const [user, setUser] = useState(null);
            const [userData, setUserData] = useState(null);
            const [prompt, setPrompt] = useState('');
            const [isGenerating, setIsGenerating] = useState(false);
            const [generatedImage, setGeneratedImage] = useState(null);

            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged(async (currentUser) => {
                    if (currentUser) {
                        setUser(currentUser);
                        const userRef = db.collection('users').doc(currentUser.uid);
                        const doc = await userRef.get();
                        const today = new Date().toISOString().split('T')[0];

                        if (!doc.exists) {
                            const newData = { credits: 5, isSubscribed: false, lastDailyReset: today };
                            await userRef.set(newData);
                            setUserData(newData);
                        } else {
                            let data = doc.data();
                            if (data.lastDailyReset!== today) {
                                await userRef.update({ credits: firebase.firestore.FieldValue.increment(5), lastDailyReset: today });
                                data.credits += 5;
                            }
                            setUserData(data);
                        }
                    } else {
                        setUser(null);
                    }
                });
                return () => unsubscribe();
            }, []);

            const login = () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());

            const generate = async () => {
                if (userData.credits < 1) return;
                setIsGenerating(true);

                try {
                    const secretDoc = await db.collection('secrets').doc('gemini_config').get();
                    if (!secretDoc.exists) throw new Error();
                    const DYNAMIC_KEY = secretDoc.data().api_key;

                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/imagen-3.0-generate-001:predict?key=${DYNAMIC_KEY}`, {
                        method: 'POST',
                        body: JSON.stringify({
                            instances: [{ prompt: prompt }],
                            parameters: { sampleCount: 1 }
                        })
                    });

                    const result = await res.json();
                    if (result.predictions) {
                        setGeneratedImage({ url: `data:image/png;base64,${result.predictions[0].bytesBase64Encoded}` });
                        await db.collection('users').doc(user.uid).update({ credits: firebase.firestore.FieldValue.increment(-1) });
                        setUserData(prev => ({...prev, credits: prev.credits - 1}));
                    }
                } catch (e) {
                }
                setIsGenerating(false);
            };

            if (!user) return (
                <div className="min-h-screen flex items-center justify-center p-6 bg-slate-950">
                    <div className="bg-slate-900 p-8 rounded-3xl border border-slate-800 w-full max-w-md text-center">
                        <h1 className="text-3xl font-black mb-6"></h1>
                        <button onClick={login} className="w-full bg-white text-black font-bold py-4 rounded-2xl flex items-center justify-center gap-3">
                            <img src="https://www.google.com/favicon.ico" className="w-5" />
                        </button>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen pb-20 bg-slate-950">
                    <nav className="p-6 border-b border-slate-800 flex justify-between items-center bg-slate-950/50 backdrop-blur-xl sticky top-0 z-50">
                        <div className="font-black text-2xl text-blue-500"></div>
                        <div className="bg-blue-600/20 text-blue-400 px-4 py-1 rounded-full text-sm font-bold border border-blue-500/30">
                            {userData?.credits}
                        </div>
                    </nav>
                    <main className="p-6 max-w-xl mx-auto">
                        <div className="bg-slate-900 p-6 rounded-3xl border border-slate-800">
                            <textarea
                                className="w-full bg-slate-800 border-none rounded-2xl p-4 min-h-[120px] text-white mb-4 outline-none focus:ring-2 focus:ring-blue-500"
                                placeholder=""
                                value={prompt}
                                onChange={e => setPrompt(e.target.value)}
                            />
                            <button
                                onClick={generate}
                                disabled={isGenerating ||!prompt}
                                className="w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-2xl font-bold disabled:opacity-50 transition-all"
                            >
                            </button>
                        </div>
                        {generatedImage && (
                            <div className="mt-8 animate-in zoom-in duration-500">
                                <img src={generatedImage.url} className="w-full rounded-3xl shadow-2xl border border-slate-800" />
                            </div>
                        )}
                        <div className="mt-12" id="paypal-button-container"></div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        setTimeout(() => {
            if(window.paypal) {
                paypal.Buttons({
                    style: { layout: 'vertical', color: 'blue', shape: 'pill' },
                    createOrder: (data, actions) => actions.order.create({
                        purchase_units: [{ amount: { value: '10.00' } }]
                    }),
                    onApprove: (data, actions) => actions.order.capture().then(() => {})
                }).render('#paypal-button-container');
            }
        }, 2000);
    </script>
</body>
</html>
