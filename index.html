<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020617; color: white; margin: 0; scroll-behavior: smooth; }
      .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); }
      .gradient-text { background: linear-gradient(90deg, #60a5fa, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .btn-primary { background: linear-gradient(90deg, #2563eb, #7c3aed); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
      .btn-primary:active { transform: scale(0.96); }
      .input-field { background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 14px; font-size: 14px; width: 100%; outline: none; color: white; transition: 0.3s; }
      .input-field:focus { border-color: #3b82f6; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); }
      .animate-fade { animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyBZn9twI9HiXgs84bK7nZmpjrnelO6Pn70",
            authDomain: "ar-ai-82399.firebaseapp.com",
            projectId: "ar-ai-82399",
            storageBucket: "ar-ai-82399.firebasestorage.app",
            messagingSenderId: "378276222105",
            appId: "1:378276222105:web:54b323909d25f0f1985408"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const GOOGLE_AI_KEY = "AIzaSyClnf16G9nwzANgd34nKG63crb9Lyqu3HA";

        function App() {
            const [user, setUser] = useState(null);
            const [userData, setUserData] = useState({ credits: 0, referralCode: '' });
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [isRegister, setIsRegister] = useState(false);
            const [prompt, setPrompt] = useState('');
            const [isGenerating, setIsGenerating] = useState(false);
            const [history, setHistory] = useState([]);
            const [msg, setMsg] = useState('');

            useEffect(() => {
                const unsub = auth.onAuthStateChanged(async (currentUser) => {
                    if (currentUser) {
                        setUser(currentUser);
                        const userRef = db.collection('users').doc(currentUser.uid);

                        userRef.onSnapshot(doc => {
                            if (doc.exists) setUserData(doc.data());
                        });

                        db.collection('history').where('uid', '==', currentUser.uid).orderBy('createdAt', 'desc')
                           .onSnapshot(snap => {
                                setHistory(snap.docs.map(doc => ({ id: doc.id,...doc.data() })));
                            });
                    } else {
                        setUser(null);
                    }
                });
                return () => unsub();
            }, []);

            const handleAuth = async () => {
                setMsg('');
                if (!email ||!password) return setMsg("");
                try {
                    if (isRegister) {
                        const res = await auth.createUserWithEmailAndPassword(email, password);
                        const refCode = Math.random().toString(36).substring(2, 8).toUpperCase();
                        await db.collection('users').doc(res.user.uid).set({
                            credits: 5,
                            referralCode: refCode,
                            email: email,
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                        setMsg("");
                    } else {
                        await auth.signInWithEmailAndPassword(email, password);
                    }
                } catch (err) { setMsg(""); }
            };

            const handleForgotPass = () => {
                if (!email) return;
                auth.sendPasswordResetEmail(email)
                   .then(() => {})
                   .catch((err) => {});
            };

            const generate = async () => {
                if (userData.credits < 1) return setMsg("");
                setIsGenerating(true);
                setMsg('');
                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/imagen-3.0-generate-001:predict?key=${GOOGLE_AI_KEY}`, {
                        method: 'POST',
                        body: JSON.stringify({ instances: [{ prompt }], parameters: { sampleCount: 1 } })
                    });
                    const result = await res.json();
                    if (result.predictions) {
                        const videoUrl = `data:image/png;base64,${result.predictions[0].bytesBase64Encoded}`;

                        await db.collection('history').add({
                            uid: user.uid,
                            url: videoUrl,
                            prompt: prompt,
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        });

                        await db.collection('users').doc(user.uid).update({
                            credits: firebase.firestore.FieldValue.increment(-1)
                        });

                        setPrompt('');
                        setMsg("");
                    }
                } catch (e) { setMsg(""); }
                setIsGenerating(false);
            };

            if (!user) return (
                <div className="min-h-screen flex items-center justify-center p-6 bg-[radial-gradient(circle_at_top_right,_var(--tw-gradient-stops))] from-blue-900/20 via-slate-950 to-slate-950">
                    <div className="glass p-10 rounded-[2.5rem] w-full max-w-md space-y-8 animate-fade shadow-2xl">
                        <div className="text-center">
                            <div className="w-16 h-16 bg-blue-600 rounded-2xl mx-auto mb-4 flex items-center justify-center text-2xl font-black italic shadow-lg shadow-blue-500/50"></div>
                            <h1 className="text-3xl font-black tracking-tighter"></h1>
                            <p className="text-slate-400 text-xs mt-2 uppercase tracking-widest font-bold"></p>
                        </div>

                        <div className="space-y-4">
                            <input type="email" placeholder="" className="input-field" onChange={e => setEmail(e.target.value)} />
                            <input type="password" placeholder="" className="input-field" onChange={e => setPassword(e.target.value)} />
                            <button onClick={handleAuth} className="w-full btn-primary py-4 rounded-2xl font-black uppercase tracking-widest text-sm shadow-xl shadow-blue-500/20 mt-2">
                            </button>
                        </div>

                        <div className="text-center space-y-4 pt-2">
                            <p onClick={() => setIsRegister(!isRegister)} className="text-[11px] text-blue-400 font-black uppercase tracking-widest cursor-pointer hover:underline">
                            </p>
                            {!isRegister && (
                                <p onClick={handleForgotPass} className="text-[10px] text-slate-500 cursor-pointer hover:text-white uppercase tracking-widest font-bold transition-all"></p>
                            )}
                        </div>
                        {msg && <div className="p-3 bg-red-500/10 border border-red-500/20 rounded-xl text-[10px] text-center text-red-400 font-bold uppercase tracking-tight"></div>}
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen pb-32">
                    <nav className="p-6 border-b border-white/5 flex justify-between items-center glass sticky top-0 z-50">
                        <div className="font-black text-2xl italic tracking-tighter"></div>
                        <div className="flex items-center gap-4">
                            <div className="bg-blue-500/20 text-blue-400 px-4 py-1.5 rounded-full text-[10px] font-black border border-blue-500/30 shadow-lg shadow-blue-500/10">
                                {userData.credits}
                            </div>
                            <button onClick={() => auth.signOut()} className="text-[10px] font-black text-slate-500 hover:text-red-400 transition-all uppercase tracking-widest"></button>
                        </div>
                    </nav>

                    <main className="p-6 max-w-xl mx-auto space-y-10 animate-fade">
                        {msg && <div className="p-4 bg-blue-500/10 border border-blue-500/20 rounded-2xl text-[10px] text-center font-black uppercase tracking-widest text-blue-400"></div>}

                        <div className="glass p-8 rounded-[2.5rem] shadow-2xl relative overflow-hidden">
                            <div className="absolute -top-10 -right-10 w-32 h-32 bg-blue-500/10 blur-3xl rounded-full"></div>
                            <label className="block text-[10px] font-black text-slate-500 mb-4 uppercase tracking-[0.2em]"></label>
                            <textarea
                                className="w-full bg-slate-900/50 border border-white/10 rounded-2xl p-5 min-h-[140px] text-sm text-white outline-none mb-6 focus:ring-2 focus:ring-blue-500 transition-all placeholder:text-slate-700"
                                placeholder=""
                                value={prompt}
                                onChange={e => setPrompt(e.target.value)}
                            />
                            <button onClick={generate} disabled={isGenerating ||!prompt} className="w-full btn-primary py-4 rounded-2xl font-black text-sm uppercase tracking-widest shadow-2xl shadow-blue-500/30 disabled:opacity-30">
                            </button>
                        </div>

                        <div className="space-y-6">
                            <div className="flex justify-between items-center px-2">
                                <h3 className="font-black text-xs uppercase tracking-widest text-slate-500"></h3>
                                <span className="text-[10px] font-bold text-slate-600 bg-white/5 px-3 py-1 rounded-full">{history.length}</span>
                            </div>

                            {history.length === 0? (
                                <div className="glass rounded-[2.5rem] p-16 text-center opacity-30 border-dashed">
                                    <p className="text-[10px] font-bold uppercase tracking-widest"></p>
                                </div>
                            ) : (
                                <div className="grid gap-6">
                                    {history.map(item => (
                                        <div key={item.id} className="glass rounded-[2rem] overflow-hidden shadow-2xl border border-white/5 animate-fade">
                                            <div className="relative group">
                                                <img src={item.url} className="w-full aspect-video object-cover" />
                                                <div className="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                                                     <a href={item.url} download={`_${item.id}.png`} className="bg-white text-black px-6 py-2 rounded-full font-black text-[10px] uppercase tracking-widest"></a>
                                                </div>
                                            </div>
                                            <div className="p-5 flex justify-between items-center bg-black/20">
                                                <p className="text-[10px] text-slate-400 italic truncate max-w-[70%] font-medium"></p>
                                                <a href={item.url} download={`_${item.id}.png`} className="text-[9px] font-black text-blue-400 border border-blue-400/20 px-3 py-1.5 rounded-lg hover:bg-blue-400 hover:text-white transition-all"></a>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </main>

                    <div className="fixed bottom-6 left-6 right-6 glass p-4 rounded-full flex items-center justify-between border border-white/10 shadow-2xl z-50 max-w-xl mx-auto">
                        <div className="flex items-center gap-3">
                            <div className="w-2.5 h-2.5 rounded-full bg-green-500 shadow-[0_0_10px_rgba(34,197,94,0.5)] animate-pulse"></div>
                            <span className="text-[10px] font-black uppercase tracking-widest text-slate-300"></span>
                        </div>
                        <div className="h-4 w-[1px] bg-white/10"></div>
                        <div className="text-[11px] font-black gradient-text tracking-tighter uppercase">{userData.credits}</div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
