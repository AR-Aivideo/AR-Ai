<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR-Ai CEO Visualizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // DATA ASLI FIREBASE AR-AI (Sudah saya isi sesuai screenshot kamu)
        const firebaseConfig = {
            apiKey: "AIzaSyBw-8RN6ll7ytKJ6xdd8SxkgxY28xjUNzs", 
            authDomain: "ar-ai-82399.firebaseapp.com",
            projectId: "ar-ai-82399",
            storageBucket: "ar-ai-82399.appspot.com",
            messagingSenderId: "367354673323",
            appId: "1:367354673323:web:96e83460662d5d886f4bbc"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        window.login = () => signInWithPopup(auth, provider);

        onAuthStateChanged(auth, async (user) => {
            const loginSection = document.getElementById('login-section');
            const mainSection = document.getElementById('main-section');
            if (user) {
                loginSection.classList.add('hidden');
                mainSection.classList.remove('hidden');
                updateCreditsUI(user.uid);
            } else {
                loginSection.classList.remove('hidden');
                mainSection.classList.add('hidden');
            }
        });

        async function updateCreditsUI(uid) {
            const userDoc = await getDoc(doc(db, "users", uid));
            if (userDoc.exists()) {
                document.getElementById('credit-count').innerText = userDoc.data().credits || 0;
            }
        }

        window.generateImage = async () => {
            const promptInput = document.getElementById('prompt-input');
            const btn = document.getElementById('gen-btn');
            const user = auth.currentUser;

            if (!promptInput.value) return alert("Ketik perintahnya dulu, Ar!");
            
            btn.innerText = "Sedang Memproses...";
            btn.disabled = true;

            try {
                // Ambil API Key Gemini dari koleksi 'secrets'
                const secretDoc = await getDoc(doc(db, "secrets", "gemini_config"));
                if (!secretDoc.exists()) throw new Error("API Key tidak ditemukan di database!");
                
                // Ambil Kredit User
                const userRef = doc(db, "users", user.uid);
                const userDoc = await getDoc(userRef);
                const currentCredits = userDoc.data().credits || 0;

                if (currentCredits < 1) throw new Error("Kredit kamu habis!");

                // Simulasi pembuatan visual
                alert("Berhasil! AI sedang memproses visual Ar: " + promptInput.value);

                // Kurangi Kredit
                await updateDoc(userRef, { credits: currentCredits - 1 });
                updateCreditsUI(user.uid);

            } catch (err) {
                alert("Gagal: " + err.message);
            } finally {
                btn.innerText = "Buat Visual Ar";
                btn.disabled = false;
            }
        };
    </script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center p-4">

    <div class="w-full max-w-md flex justify-between items-center mb-6 bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold text-sm">Ar</div>
            <h1 class="text-lg font-bold text-slate-800">AR-Ai CEO</h1>
        </div>
        <div class="bg-blue-50 px-4 py-1.5 rounded-full border border-blue-100 text-blue-700 font-bold">
            <span class="text-xs mr-1 text-slate-500 uppercase">Kredit:</span><span id="credit-count">0</span>
        </div>
    </div>

    <div id="login-section" class="hidden text-center py-20">
        <h2 class="text-2xl font-black mb-2 text-slate-900">Halo, Ar!</h2>
        <p class="text-slate-500 mb-8">Masuk untuk melihat perjalananmu jadi CEO.</p>
        <button onclick="login()" class="bg-white border border-slate-300 px-6 py-3 rounded-xl flex items-center gap-3 mx-auto shadow-sm hover:bg-slate-50 active:scale-95 transition-all">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" width="18">
            <span class="font-bold text-slate-700">Masuk dengan Google</span>
        </button>
    </div>

    <div id="main-section" class="hidden w-full max-w-md animate-in fade-in duration-700">
        <div class="bg-white p-6 rounded-3xl shadow-xl border border-slate-200">
            <p class="text-xs font-bold text-slate-400 mb-3 uppercase tracking-widest">Input Visual Perjalanan</p>
            <textarea id="prompt-input" 
                class="w-full h-40 p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl mb-4 focus:border-blue-500 outline-none transition-all text-lg text-slate-800"
                placeholder="Contoh: Ar sedang duduk santai di ruang CEO lantai 50..."></textarea>
            
            <button id="gen-btn" onclick="generateImage()" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-2xl shadow-lg shadow-blue-200 active:scale-95 transition-all uppercase tracking-wider">
                Buat Visual Ar
            </button>
        </div>
    </div>

</body>
</html>
