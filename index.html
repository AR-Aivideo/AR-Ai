<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR ai - Text to Video</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-app-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-auth-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-firestore-compat.min.js"></script>
    <script src="https://www.paypal.com/sdk/js?client-id=BAA_bdWr_OdmF1y_3tOn55i013VoUO7FC7xJhZCwcR2S4YiQQTJjJgsPhDegYP6rkzQEpu3oUq0a-xvGtA&currency=USD"></script>
</head>
<body class="bg-gray-900 text-white font-sans">

    <nav class="p-5 border-b border-gray-800 flex justify-between items-center">
        <h1 class="text-2xl font-bold text-blue-500">AR ai</h1>
        <div id="auth-status" class="flex gap-4 items-center">
            </div>
    </nav>

    <main class="container mx-auto mt-10 p-5">
        <div id="app-content" class="hidden">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                
                <div class="md:col-span-2 bg-gray-800 p-6 rounded-xl shadow-lg">
                    <h2 class="text-xl font-semibold mb-4">Buat Video dari Teks</h2>
                    <p class="text-sm text-gray-400 mb-4">1 Video = 1 Kredit</p>
                    <textarea id="prompt-input" rows="4" class="w-full bg-gray-700 p-4 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Deskripsikan video yang ingin Anda buat..."></textarea>
                    <button id="generate-btn" class="mt-4 w-full bg-blue-600 hover:bg-blue-700 p-3 rounded-lg font-bold transition">Generate Video</button>
                    
                    <div id="result-area" class="mt-6 hidden">
                        <h3 class="font-bold text-green-400 mb-2">Hasil AI:</h3>
                        <div id="ai-response" class="bg-black p-4 rounded-lg text-sm border border-gray-700 whitespace-pre-wrap"></div>
                    </div>
                </div>

                <div class="space-y-6">
                    <div class="bg-gray-800 p-6 rounded-xl shadow-lg">
                        <h2 class="text-lg font-bold mb-2">Profil Saya</h2>
                        <p id="user-email" class="text-sm text-gray-400"></p>
                        <div class="mt-4 bg-blue-900/30 p-4 rounded-lg border border-blue-500">
                            <span class="block text-xs uppercase tracking-wider">Sisa Kredit</span>
                            <span id="credit-count" class="text-3xl font-bold">0</span>
                        </div>
                        <p class="text-[10px] mt-2 text-gray-500 italic">*Kredit bertambah 5 setiap hari otomatis</p>
                    </div>

                    <div class="bg-gray-800 p-6 rounded-xl shadow-lg">
                        <h2 class="text-lg font-bold mb-4">Beli Kredit / Langganan</h2>
                        <div id="paypal-button-container"></div>
                    </div>

                    <div class="bg-gray-800 p-6 rounded-xl shadow-lg text-center">
                        <h2 class="text-sm font-bold mb-2">Referal Program</h2>
                        <p class="text-xs text-gray-400 mb-2">Bagikan kode ini untuk dapat +1 kredit/orang</p>
                        <code id="ref-code" class="bg-black p-2 rounded block text-blue-400 font-mono"></code>
                    </div>
                </div>
            </div>
        </div>

        <div id="auth-form" class="max-w-md mx-auto bg-gray-800 p-8 rounded-xl shadow-2xl mt-20">
            <h2 id="form-title" class="text-2xl font-bold mb-6 text-center">Login ke AR ai</h2>
            <input type="email" id="email" placeholder="Email" class="w-full mb-4 p-3 rounded bg-gray-700 border border-gray-600 focus:border-blue-500 outline-none">
            <input type="password" id="password" placeholder="Password" class="w-full mb-6 p-3 rounded bg-gray-700 border border-gray-600 focus:border-blue-500 outline-none">
            <button id="main-auth-btn" class="w-full bg-blue-600 p-3 rounded-lg font-bold hover:bg-blue-700 mb-4">Masuk</button>
            <div class="text-center text-sm">
                <a href="#" id="toggle-auth" class="text-blue-400 hover:underline">Belum punya akun? Daftar</a>
                <br><br>
                <a href="#" id="forgot-pw" class="text-gray-400 hover:underline italic">Lupa kata sandi?</a>
            </div>
        </div>
    </main>

    <script>
        // FIREBASE CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyClLSO35yldEXJl0HJnQ3mTFo4kxZICs5k",
            authDomain: "ar-ai-generator-8a388.firebaseapp.com",
            projectId: "ar-ai-generator-8a388",
            storageBucket: "ar-ai-generator-8a388.firebasestorage.app",
            messagingSenderId: "871534184989",
            appId: "1:871534184989:web:65ff5cab9e3db19b8414f4",
            measurementId: "G-NDR1LQ7KXV"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // AI STUDIO CONFIG
        const GEMINI_API_KEY = "AIzaSyAgcaRt967erWBF5cPv71nxjyZlD0mvmRI";

        // State Management
        let isLoginMode = true;
        let currentUser = null;

        // UI Elements
        const authForm = document.getElementById('auth-form');
        const appContent = document.getElementById('app-content');
        const authStatus = document.getElementById('auth-status');

        // Toggle Login/Register
        document.getElementById('toggle-auth').addEventListener('click', (e) => {
            e.preventDefault();
            isLoginMode = !isLoginMode;
            document.getElementById('form-title').innerText = isLoginMode ? 'Login ke AR ai' : 'Daftar AR ai';
            document.getElementById('main-auth-btn').innerText = isLoginMode ? 'Masuk' : 'Daftar Sekarang';
            e.target.innerText = isLoginMode ? 'Belum punya akun? Daftar' : 'Sudah punya akun? Login';
        });

        // Forgot Password
        document.getElementById('forgot-pw').addEventListener('click', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            if(!email) return alert("Masukkan email Anda terlebih dahulu");
            try {
                await auth.sendPasswordResetEmail(email);
                alert("Link reset password telah dikirim ke email Anda!");
            } catch (err) { alert(err.message); }
        });

        // Auth Logic
        document.getElementById('main-auth-btn').addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                if (isLoginMode) {
                    await auth.signInWithEmailAndPassword(email, password);
                } else {
                    const res = await auth.createUserWithEmailAndPassword(email, password);
                    // Create User Document
                    await db.collection('users').doc(res.user.uid).set({
                        email: email,
                        credits: 5,
                        referralCode: 'AR-' + Math.random().toString(36).substring(7).toUpperCase(),
                        lastDailyReset: firebase.firestore.Timestamp.now()
                    });
                }
            } catch (err) { alert(err.message); }
        });

        // Monitor Auth State
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                authForm.classList.add('hidden');
                appContent.classList.remove('hidden');
                authStatus.innerHTML = `<button onclick="auth.signOut()" class="text-sm bg-red-600/20 text-red-400 px-3 py-1 rounded border border-red-500">Keluar</button>`;
                
                // Realtime Data Sync
                db.collection('users').doc(user.uid).onSnapshot(doc => {
                    if(doc.exists) {
                        const data = doc.data();
                        document.getElementById('credit-count').innerText = data.credits;
                        document.getElementById('user-email').innerText = data.email;
                        document.getElementById('ref-code').innerText = data.referralCode;
                        checkDailyBonus(data);
                    }
                });
                renderPayPal();
            } else {
                currentUser = null;
                authForm.classList.remove('hidden');
                appContent.classList.add('hidden');
                authStatus.innerHTML = '';
            }
        });

        // Daily Bonus Logic
        async function checkDailyBonus(data) {
            const today = new Date().toDateString();
            const lastReset = data.lastDailyReset.toDate().toDateString();
            
            if (today !== lastReset) {
                await db.collection('users').doc(currentUser.uid).update({
                    credits: firebase.firestore.FieldValue.increment(5),
                    lastDailyReset: firebase.firestore.Timestamp.now()
                });
                alert("Bonus harian! +5 Kredit ditambahkan.");
            }
        }

        // Generate Video Logic (Calling Gemini API)
        document.getElementById('generate-btn').addEventListener('click', async () => {
            const prompt = document.getElementById('prompt-input').value;
            const btn = document.getElementById('generate-btn');

            if (!prompt) return alert("Isi teks dulu!");
            
            // Check Credits
            const userDoc = await db.collection('users').doc(currentUser.uid).get();
            if (userDoc.data().credits < 1) return alert("Kredit habis! Silakan beli atau tunggu besok.");

            btn.disabled = true;
            btn.innerText = "Processing Video...";

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `Create a detailed video storyboard and visual description for: ${prompt}. Break it down into scenes and camera movements.` }] }]
                    })
                });

                const result = await response.json();
                const aiText = result.candidates[0].content.parts[0].text;

                // Subtract Credit
                await db.collection('users').doc(currentUser.uid).update({
                    credits: firebase.firestore.FieldValue.increment(-1)
                });

                document.getElementById('result-area').classList.remove('hidden');
                document.getElementById('ai-response').innerText = aiText;

            } catch (err) {
                alert("Gagal memproses AI: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Generate Video";
            }
        });

        // PayPal Integration
        function renderPayPal() {
            document.getElementById('paypal-button-container').innerHTML = '';
            paypal.Buttons({
                createOrder: (data, actions) => {
                    return actions.order.create({
                        purchase_units: [{
                            amount: { value: '2.00' } // Contoh Harga: $2 untuk 10 kredit
                        }]
                    });
                },
                onApprove: (data, actions) => {
                    return actions.order.capture().then(async (details) => {
                        await db.collection('users').doc(currentUser.uid).update({
                            credits: firebase.firestore.FieldValue.increment(10)
                        });
                        alert('Pembayaran Berhasil! +10 Kredit ditambahkan. Terima kasih ' + details.payer.name.given_name);
                    });
                }
            }).render('#paypal-button-container');
        }
    </script>
</body>
</html>
