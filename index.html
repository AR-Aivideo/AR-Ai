<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR AI - Text to Video Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; scroll-behavior: smooth; }
        .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gradient-bg { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); }
        .btn-primary { background: linear-gradient(90deg, #3b82f6 0%, #8b5cf6 100%); transition: all 0.3s ease; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.4); }
        @keyframes pulse-slow { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.6; } }
        .bg-glow { position: absolute; width: 400px; height: 400px; background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, transparent 70%); filter: blur(40px); z-index: -1; animation: pulse-slow 8s infinite; }
        .animate-bounce-short { animation: bounce 1s ease-in-out 1; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen overflow-x-hidden">

    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, increment, onSnapshot, collection, query, where } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Konfigurasi Firebase
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const googleProvider = new GoogleAuthProvider();

        const APP_ID = typeof __app_id !== 'undefined' ? __app_id : 'ar-ai-service';
        const AI_STUDIO_KEY = "AIzaSyAgcaRt967erWBF5cPv71nxjyZlD0mvmRI";
        const PAYPAL_CLIENT_ID = "BAA_bdWr_OdmF1y_3tOn55i013VoUO7FC7xJhZCwcR2S4YiQQTJjJgsPhDegYP6rkzQEpu3oUq0a-xvGtA";

        window.FB = { auth, db, googleProvider, APP_ID, AI_STUDIO_KEY, PAYPAL_CLIENT_ID };
        window.FB_OPS = { 
            signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, onAuthStateChanged, 
            signOut, sendPasswordResetEmail, doc, getDoc, setDoc, updateDoc, increment, onSnapshot 
        };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { 
            Video, Zap, CreditCard, Users, LogOut, ChevronRight, Star, 
            ShieldCheck, RefreshCcw, AlertCircle, CheckCircle2, Mail, Lock, 
            Loader2, Copy, Trash2, Download, ArrowRight, Play, ExternalLink, User
        } = lucide;

        // --- COMPONENTS ---

        const App = () => {
            const [user, setUser] = useState(null);
            const [userData, setUserData] = useState(null);
            const [loading, setLoading] = useState(true);
            const [authMode, setAuthMode] = useState('login'); 
            const [formData, setFormData] = useState({ email: '', password: '' });
            const [prompt, setPrompt] = useState('');
            const [isGenerating, setIsGenerating] = useState(false);
            const [notif, setNotif] = useState(null);
            const [activeTab, setActiveTab] = useState('generate');

            useEffect(() => {
                const unsubscribe = window.FB_OPS.onAuthStateChanged(window.FB.auth, (u) => {
                    setUser(u);
                    if (!u) {
                        setLoading(false);
                        setUserData(null);
                    }
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;

                const urlParams = new URLSearchParams(window.location.search);
                const referrerId = urlParams.get('ref');

                const userRef = window.FB_OPS.doc(window.FB.db, 'artifacts', window.FB.APP_ID, 'users', user.uid);
                
                const unsubscribe = window.FB_OPS.onSnapshot(userRef, async (docSnap) => {
                    const today = new Date().toISOString().split('T')[0];

                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        
                        // Logika Reset Harian: Isi ulang ke 5 kredit jika hari baru
                        if (data.lastResetDate !== today) {
                            const refillAmount = Math.max(0, 5 - data.credits);
                            await window.FB_OPS.updateDoc(userRef, {
                                credits: window.FB_OPS.increment(refillAmount),
                                lastResetDate: today
                            });
                        }
                        setUserData(data);
                    } else {
                        // Inisialisasi User Baru
                        const newUser = {
                            uid: user.uid,
                            email: user.email,
                            credits: 5,
                            totalGenerated: 0,
                            isSubscribed: false,
                            lastResetDate: today,
                            referralCode: user.uid.substring(0, 8),
                            referredBy: referrerId || null,
                            createdAt: new Date().toISOString()
                        };
                        await window.FB_OPS.setDoc(userRef, newUser);

                        // Bonus Referal (+1 untuk perujuk)
                        if (referrerId && referrerId !== user.uid) {
                            const refUserRef = window.FB_OPS.doc(window.FB.db, 'artifacts', window.FB.APP_ID, 'users', referrerId);
                            await window.FB_OPS.updateDoc(refUserRef, {
                                credits: window.FB_OPS.increment(1)
                            }).catch(err => console.error("Referrer not found", err));
                        }
                    }
                    setLoading(false);
                });

                return () => unsubscribe();
            }, [user]);

            const notify = (text, type = 'success') => {
                setNotif({ text, type });
                setTimeout(() => setNotif(null), 5000);
            };

            const handleAuth = async (e) => {
                e.preventDefault();
                setLoading(true);
                try {
                    if (authMode === 'register') {
                        await window.FB_OPS.createUserWithEmailAndPassword(window.FB.auth, formData.email, formData.password);
                        notify("Akun berhasil dibuat!");
                    } else if (authMode === 'login') {
                        await window.FB_OPS.signInWithEmailAndPassword(window.FB.auth, formData.email, formData.password);
                    } else {
                        await window.FB_OPS.sendPasswordResetEmail(window.FB.auth, formData.email);
                        notify("Link reset password dikirim ke email.", "info");
                        setAuthMode('login');
                    }
                } catch (err) {
                    notify(err.message, "error");
                }
                setLoading(false);
            };

            const loginWithGoogle = async () => {
                try {
                    await window.FB_OPS.signInWithPopup(window.FB.auth, window.FB.googleProvider);
                } catch (err) {
                    notify("Gagal masuk dengan Google.", "error");
                }
            };

            const handleGenerate = async () => {
                if (userData.credits < 1) {
                    notify("Kredit tidak cukup. Silakan top up atau tunggu besok.", "error");
                    return;
                }
                if (!prompt) return;

                setIsGenerating(true);
                try {
                    // Panggil Gemini untuk penyempurnaan prompt
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${window.FB.AI_STUDIO_KEY}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: `Translate and enhance this video prompt to be more cinematic: "${prompt}"` }] }]
                        })
                    });
                    
                    await new Promise(r => setTimeout(r, 4000)); // Simulasi rendering

                    const userRef = window.FB_OPS.doc(window.FB.db, 'artifacts', window.FB.APP_ID, 'users', user.uid);
                    await window.FB_OPS.updateDoc(userRef, {
                        credits: window.FB_OPS.increment(-1),
                        totalGenerated: window.FB_OPS.increment(1)
                    });

                    notify("Video Anda berhasil dibuat! Hasil akan muncul di riwayat (Simulasi).");
                    setPrompt('');
                } catch (err) {
                    notify("Gagal memproses AI. Cek koneksi Anda.", "error");
                } finally {
                    setIsGenerating(false);
                }
            };

            const initPaypal = (amount, planName, type) => {
                const container = document.getElementById('paypal-button-container');
                if (!container) return;
                container.innerHTML = ''; 

                window.paypal.Buttons({
                    createOrder: (data, actions) => {
                        return actions.order.create({
                            purchase_units: [{
                                description: planName,
                                amount: { currency_code: "USD", value: amount }
                            }]
                        });
                    },
                    onApprove: async (data, actions) => {
                        const order = await actions.order.capture();
                        const userRef = window.FB_OPS.doc(window.FB.db, 'artifacts', window.FB.APP_ID, 'users', user.uid);
                        
                        if (type === 'topup') {
                            await window.FB_OPS.updateDoc(userRef, { credits: window.FB_OPS.increment(20) });
                            notify("Berhasil menambah 20 Kredit!");
                        } else {
                            await window.FB_OPS.updateDoc(userRef, { 
                                isSubscribed: true, 
                                credits: window.FB_OPS.increment(100) 
                            });
                            notify("Berhasil berlangganan paket PRO!");
                        }
                    },
                    onError: (err) => {
                        notify("Terjadi masalah pada pembayaran.", "error");
                    }
                }).render('#paypal-button-container');
            };

            if (loading) return (
                <div className="h-screen flex flex-col items-center justify-center">
                    <Loader2 className="w-12 h-12 text-blue-500 animate-spin mb-4" />
                    <p className="text-slate-400 font-medium">Memuat AR AI...</p>
                </div>
            );

            if (!user) return (
                <div className="relative min-h-screen flex items-center justify-center p-6">
                    <div className="bg-glow top-20 -left-20"></div>
                    <div className="bg-glow bottom-20 -right-20"></div>

                    <div className="w-full max-w-md glass p-8 rounded-[40px] shadow-2xl relative z-10">
                        <div className="text-center mb-8">
                            <div className="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-blue-600/30">
                                <Video className="text-white w-8 h-8" />
                            </div>
                            <h1 className="text-3xl font-extrabold tracking-tight italic">AR <span className="text-blue-500">AI</span></h1>
                            <p className="text-slate-400 mt-2 text-sm">Pembuatan video dari teks kelas dunia.</p>
                        </div>

                        <form onSubmit={handleAuth} className="space-y-4">
                            <div className="relative">
                                <Mail className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500" size={18} />
                                <input 
                                    type="email" required placeholder="Email Anda"
                                    className="w-full bg-slate-900 border border-slate-800 rounded-2xl py-3 pl-10 pr-4 focus:ring-2 focus:ring-blue-500 outline-none"
                                    value={formData.email} onChange={e => setFormData({...formData, email: e.target.value})}
                                />
                            </div>

                            {authMode !== 'forgot' && (
                                <div className="relative">
                                    <Lock className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500" size={18} />
                                    <input 
                                        type="password" required placeholder="Password"
                                        className="w-full bg-slate-900 border border-slate-800 rounded-2xl py-3 pl-10 pr-4 focus:ring-2 focus:ring-blue-500 outline-none"
                                        value={formData.password} onChange={e => setFormData({...formData, password: e.target.value})}
                                    />
                                </div>
                            )}

                            <button type="submit" className="w-full btn-primary py-3.5 rounded-2xl font-bold text-white mt-2">
                                {authMode === 'login' ? 'Masuk' : authMode === 'register' ? 'Daftar Sekarang' : 'Reset Password'}
                            </button>
                        </form>

                        <div className="relative my-6">
                            <div className="absolute inset-0 flex items-center"><div className="w-full border-t border-slate-800"></div></div>
                            <div className="relative flex justify-center text-[10px] uppercase font-bold"><span className="bg-slate-950 px-3 text-slate-500">Atau</span></div>
                        </div>

                        <button onClick={loginWithGoogle} className="w-full bg-white text-slate-950 py-3.5 rounded-2xl font-bold flex items-center justify-center gap-2 hover:bg-slate-200 transition-all">
                            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" className="w-5 h-5" alt="Google" />
                            Lanjutkan dengan Google
                        </button>

                        <div className="mt-6 text-center space-y-3">
                            <button onClick={() => setAuthMode(authMode === 'login' ? 'register' : 'login')} className="text-sm text-blue-400 hover:underline">
                                {authMode === 'login' ? 'Belum punya akun? Daftar' : 'Sudah punya akun? Masuk'}
                            </button>
                            {authMode === 'login' && (
                                <div><button onClick={() => setAuthMode('forgot')} className="text-xs text-slate-500">Lupa kata sandi?</button></div>
                            )}
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="max-w-6xl mx-auto px-6 py-8">
                    <header className="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-10">
                        <div className="flex items-center gap-3">
                            <div className="p-2.5 bg-blue-600 rounded-xl shadow-lg shadow-blue-600/30">
                                <Video className="w-6 h-6 text-white" />
                            </div>
                            <div>
                                <h2 className="text-2xl font-black italic tracking-tighter">AR <span className="text-blue-500">AI</span></h2>
                                <p className="text-[10px] uppercase font-bold text-slate-500 tracking-widest">Video Studio</p>
                            </div>
                        </div>
                        
                        <div className="flex items-center gap-4 bg-slate-900 p-2 rounded-2xl border border-slate-800">
                            <div className="flex items-center gap-2 px-3 border-r border-slate-800">
                                <div className="w-8 h-8 bg-slate-800 rounded-lg flex items-center justify-center text-blue-400">
                                    <User size={18} />
                                </div>
                                <span className="text-xs font-bold text-slate-300 hidden sm:block max-w-[120px] truncate">{user.email}</span>
                            </div>
                            <button onClick={() => window.FB.auth.signOut()} className="p-2 text-slate-400 hover:text-red-400 transition-colors">
                                <LogOut size={18} />
                            </button>
                        </div>
                    </header>

                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                        {}
                        <div className="lg:col-span-8 space-y-6">
                            <div className="glass p-8 rounded-[32px] border-blue-500/20 relative overflow-hidden">
                                <div className="absolute top-0 right-0 p-4">
                                    <div className="flex items-center gap-2 bg-slate-900/80 border border-slate-800 px-3 py-1 rounded-full">
                                        <Zap size={12} className="text-yellow-500 fill-yellow-500" />
                                        <span className="text-[10px] font-bold">1 Kredit / Video</span>
                                    </div>
                                </div>

                                <h3 className="text-xl font-bold mb-1 flex items-center gap-2">
                                    Mulai Berkreasi
                                </h3>
                                <p className="text-slate-400 text-sm mb-6">Ceritakan video yang ingin Anda buat, AI kami akan mengaturnya.</p>
                                
                                <div className="relative group">
                                    <textarea 
                                        className="w-full h-52 bg-slate-950 border border-slate-800 rounded-3xl p-6 text-slate-100 placeholder-slate-600 focus:ring-2 focus:ring-blue-500/50 outline-none trans
